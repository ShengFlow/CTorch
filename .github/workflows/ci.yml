name: CTorch CI

on:
  push:
    branches: [ main, master, feature-DCU, develop ]
  pull_request:
    branches: [ main, master, feature-DCU, develop ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-13
          - os: macos-14
            compiler: apple-clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python & CMake 3.31+
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install modern CMake & Ninja
        run: |
          pip install --upgrade pip cmake ninja

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 gcc-13 libomp-dev
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "OPENMP_ROOT=$(brew --prefix libomp)" >> $GITHUB_ENV

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCT_ENABLE_LTO=OFF \
            -DCT_ENABLE_MLIR=OFF \
            -DFETCH_GOOGLETEST=ON \
            -DCT_TARGET_SIMD=AUTO \
            -DTEST_ENABLED=ON

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCT_ENABLE_LTO=OFF \
            -DCT_ENABLE_MLIR=OFF \
            -DFETCH_GOOGLETEST=ON \
            -DOpenMP_ROOT="${OPENMP_ROOT}" \
            -DTEST_ENABLED=ON

      - name: Build Core Test Targets
        run: |
          cmake --build build --target test_core_semantics test_unary_inplace test_autograd_v2 MnistTest -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)

      - name: Run Core Regression & Semantics Tests
        run: |
          echo "=== Running test_core_semantics ==="
          ./build/test_core_semantics
          echo "=== Running test_unary_inplace ==="
          ./build/test_unary_inplace
          echo "=== Running test_autograd_v2 ==="
          ./build/test_autograd_v2
          echo "=== Running MnistTest ==="
          ./build/MnistTest
