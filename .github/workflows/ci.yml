name: CTorch CI

on:
  push:
    branches: [ main, master, feature-DCU, feature-c3-pipeline, develop ]
  pull_request:
    branches: [ main, master, feature-DCU, feature-c3-pipeline, develop ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-13
          - os: macos-14
            compiler: apple-clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python & CMake 3.31+
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install modern CMake & Ninja
        run: |
          pip install --upgrade pip cmake ninja

      - name: Install Linux Dependencies (LLVM/MLIR & GCC-13)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 gcc-13 libomp-dev llvm-18-dev libmlir-18-dev mlir-18-tools zlib1g-dev libzstd-dev libopenblas-dev
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV
          echo "MLIR_DIR=/usr/lib/llvm-18/lib/cmake/mlir" >> $GITHUB_ENV

      - name: Cache Homebrew LLVM
        if: runner.os == 'macOS'
        id: cache-homebrew-llvm
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/opt/llvm@18
            /opt/homebrew/Cellar/llvm@18
          key: ${{ runner.os }}-homebrew-llvm18-v1

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "OPENMP_ROOT=$(brew --prefix libomp)" >> $GITHUB_ENV
          if [ ! -d "/opt/homebrew/opt/llvm@18" ]; then
            brew install llvm@18
          fi
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> $GITHUB_ENV
          echo "MLIR_DIR=$(brew --prefix llvm@18)/lib/cmake/mlir" >> $GITHUB_ENV

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCT_ENABLE_LTO=OFF \
            -DCT_ENABLE_MLIR=ON \
            -DFETCH_GOOGLETEST=ON \
            -DCT_TARGET_SIMD=AUTO \
            -DTEST_ENABLED=ON

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCT_ENABLE_LTO=OFF \
            -DCT_ENABLE_MLIR=ON \
            -DFETCH_GOOGLETEST=ON \
            -DOpenMP_ROOT="${OPENMP_ROOT}" \
            -DTEST_ENABLED=ON

      - name: Build Test Targets
        run: |
          cmake --build build --target test_core_semantics test_unary_inplace test_autograd_v2 MnistTest \
            test_c3_graph test_c3_pipeline test_c3_memory_planner test_c3_graph_fusion_clusterer \
            test_ram_ad_multi_output test_ctorch_new_algorithms_integration test_mnist_c3_replacement \
            test_amx_flash_attention test_flash_attention_3_fp8 test_amx_cluster_mpgemm \
            bench_llama_e2e_pipeline \
            -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2) \
            || {
              echo "::error title=Build Failure::Build failed, running verbose single-thread build:"
              ninja -C build -v -j 1 || true
              exit 1
            }

      - name: Run Core Regression & Semantics Tests
        run: |
          echo "=== Running test_core_semantics ==="
          ./build/test_core_semantics
          echo "=== Running test_unary_inplace ==="
          ./build/test_unary_inplace
          echo "=== Running test_autograd_v2 ==="
          ./build/test_autograd_v2
          echo "=== Running MnistTest ==="
          cp -f mnist/*ubyte . || true
          CTORCH_DEVICE=cpu ./build/MnistTest

      - name: Run C3 JIT, Pipeline, RAM-AD & Micro-Kernel Tests
        run: |
          echo "=== Running test_c3_graph (MLIR JIT Graph Compiler) ==="
          ./build/test_c3_graph
          echo "=== Running test_c3_pipeline ==="
          ./build/test_c3_pipeline
          echo "=== Running test_c3_memory_planner ==="
          ./build/test_c3_memory_planner
          echo "=== Running test_c3_graph_fusion_clusterer ==="
          ./build/test_c3_graph_fusion_clusterer
          echo "=== Running test_ram_ad_multi_output ==="
          ./build/test_ram_ad_multi_output
          echo "=== Running test_ctorch_new_algorithms_integration ==="
          ./build/test_ctorch_new_algorithms_integration
          echo "=== Running test_mnist_c3_replacement ==="
          ./build/test_mnist_c3_replacement
          echo "=== Running test_amx_flash_attention ==="
          ./build/test_amx_flash_attention
          echo "=== Running test_flash_attention_3_fp8 ==="
          ./build/test_flash_attention_3_fp8
          echo "=== Running test_amx_cluster_mpgemm ==="
          ./build/test_amx_cluster_mpgemm

      - name: Run LLaMA E2E Pipeline Benchmark
        run: |
          echo "=== Running bench_llama_e2e_pipeline ==="
          ./build/bench_llama_e2e_pipeline
